global:
  resolve_timeout: 5m

route:
  receiver: "discord"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - match:
        severity: critical
      receiver: "discord"
      repeat_interval: 30m

receivers:
  - name: "discord"
    webhook_configs:
      - url: "http://alertmanager-discord:9094"
        send_resolved: true
        max_alerts: 5

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["service"]
